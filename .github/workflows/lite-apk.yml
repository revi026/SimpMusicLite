name: Build lite APK (FOSS, single ABI)

# Fork-only workflow: builds the FOSS flavour (no Sentry, no Cast, no Last.fm) for one CPU ABI
# and signs it. It needs no secrets. Without a SIGNING_KEY secret it signs with a throwaway key
# (see the "Prepare signing key" step).

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "Comma-separated ABIs to build (armeabi-v7a, arm64-v8a, x86_64)"
        required: false
        default: "arm64-v8a"
  push:
    branches:
      - lite

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions -PisFullBuild=false

      - name: Build release APK (FOSS)
        shell: bash
        run: |
          ./gradlew androidApp:assembleRelease \
            -PisFullBuild=false \
            -Psimpmusic.abis=${{ inputs.abis || 'arm64-v8a' }} \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Logs need a login to read; annotations do not. Surface the Gradle error there.
      - name: Summarise build failure
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          {
            awk '/\* What went wrong:/{f=1} /\* Try:/{f=0} f' "$LOG" | head -n 25
            grep -E '^e: |^w: .*error|Caused by:' "$LOG" | head -n 15
          } > "$RUNNER_TEMP/summary.txt"
          msg="$(head -c 3500 "$RUNNER_TEMP/summary.txt" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          echo "::error title=Gradle failure::$msg"

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "$KS"
            KS_ALIAS="$ALIAS"
            KS_PASS="$KEY_STORE_PASSWORD"
            K_PASS="$KEY_PASSWORD"
          else
            echo "::warning::No SIGNING_KEY secret: signing with a throwaway key. Every build gets a different signature, so uninstall the old app before installing a new build."
            KS_ALIAS="throwaway"
            KS_PASS="$(openssl rand -hex 16)"
            K_PASS="$KS_PASS"
            keytool -genkeypair -keystore "$KS" -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$K_PASS" \
              -dname "CN=SimpMusic Lite"
          fi
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$K_PASS"
          {
            echo "KS_PATH=$KS"
            echo "KS_ALIAS=$KS_ALIAS"
            echo "KS_PASS=$KS_PASS"
            echo "K_PASS=$K_PASS"
          } >> "$GITHUB_ENV"

      - name: Align and sign
        run: |
          BT_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          echo "Using build-tools: $BT_DIR"
          OUT=androidApp/build/outputs/apk/release
          ls -la "$OUT"
          shopt -s nullglob
          files=("$OUT"/*-unsigned.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No *-unsigned.apk found in $OUT"
            exit 1
          fi
          for f in "${files[@]}"; do
            base="${f%-unsigned.apk}"
            "$BT_DIR/zipalign" -p -f 4 "$f" "$base-aligned.apk"
            "$BT_DIR/apksigner" sign \
              --ks "$KS_PATH" --ks-key-alias "$KS_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:K_PASS \
              --out "$base-signed.apk" "$base-aligned.apk"
            "$BT_DIR/apksigner" verify --print-certs "$base-signed.apk" | head -n 3
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simpmusic-lite
          path: androidApp/build/outputs/apk/release/*-signed.apk
          retention-days: 14
          if-no-files-found: error
