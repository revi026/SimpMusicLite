name: Lỗi phát nhạc
description: Nhạc không phát, bị dừng, tải mãi hoặc báo lỗi khi phát
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Đây là nơi nhận phản hồi về **SimpMusic Lite**, một bản fork cá nhân. Tác giả SimpMusic gốc không hỗ trợ bản này, nên xin đừng gửi lỗi của bản Lite sang dự án gốc.

        ⚠️ **Issue là công khai, ai cũng đọc được.** Đừng dán cookie, API key, token, email hay thông tin tài khoản. Hãy đọc lại log và ảnh chụp trước khi đính kèm.

  - type: checkboxes
    id: checks
    attributes:
      label: Kiểm tra trước khi gửi
      options:
        - label: Mình đã tìm trong các issue đang mở và đã đóng, chưa thấy ai báo lỗi này.
          required: true
        - label: "Mình đang dùng [bản mới nhất](https://github.com/revi026/SimpMusicLite/releases/latest) và lỗi vẫn còn."
          required: true

  - type: input
    id: track
    attributes:
      label: Bài bị lỗi (tên bài hoặc link)
      description: Ghi thêm nếu bài nào cũng bị.

  - type: checkboxes
    id: context
    attributes:
      label: Bối cảnh (đánh dấu nếu đúng)
      options:
        - label: Mình đang đăng nhập tài khoản YouTube Music
        - label: Đang bật crossfade hoặc chuyển bài kiểu DJ
        - label: Lỗi bắt đầu sau khi mạng bị ngắt hoặc đổi mạng

  - type: textarea
    id: description
    attributes:
      label: Mô tả lỗi
      placeholder: Nhạc không phát, tự dừng, tải mãi hay hiện thông báo lỗi?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Các bước làm lại lỗi
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Kết quả bạn mong đợi
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Phiên bản SimpMusic Lite
      description: Xem trong Cài đặt → Giới thiệu & nhà phát triển.
      placeholder: "ví dụ: 1.1.0"
    validations:
      required: true

  - type: dropdown
    id: abi
    attributes:
      label: Bản APK đã cài
      options:
        - arm64-v8a (64-bit)
        - armeabi-v7a (32-bit)
        - Không rõ
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Đời máy
      placeholder: "ví dụ: Samsung Galaxy J7 Prime"
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Phiên bản Android
      placeholder: "ví dụ: Android 10"
    validations:
      required: true

  - type: input
    id: rom
    attributes:
      label: ROM cook hoặc ROM port (nếu có)
      description: Để trống nếu máy dùng ROM gốc.
      placeholder: Tên ROM

  - type: textarea
    id: logs
    attributes:
      label: Log hoặc thông báo lỗi (không bắt buộc)
      description: Nếu app bị văng, dán log vào đây. Nhớ xóa mọi thông tin riêng tư trước.

  - type: textarea
    id: screenshots
    attributes:
      label: Ảnh chụp màn hình (không bắt buộc)
