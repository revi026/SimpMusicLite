name: Đề xuất tính năng
description: Góp ý cải thiện hoặc đề xuất tính năng mới
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Đây là nơi nhận phản hồi về **SimpMusic Lite**, một bản fork cá nhân. Tác giả SimpMusic gốc không hỗ trợ bản này, nên xin đừng gửi lỗi của bản Lite sang dự án gốc.

        ⚠️ **Issue là công khai, ai cũng đọc được.** Đừng dán cookie, API key, token, email hay thông tin tài khoản. Hãy đọc lại log và ảnh chụp trước khi đính kèm.
        
        Mục tiêu của bản Lite là chạy nhẹ trên máy cấu hình thấp, nên những hiệu ứng nặng đã gỡ nhiều khả năng sẽ không được thêm lại.

  - type: textarea
    id: problem
    attributes:
      label: Vấn đề bạn đang gặp
      placeholder: Điều gì đang bất tiện hoặc còn thiếu?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Cách bạn muốn app giải quyết
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Thông tin thêm (không bắt buộc)
      description: Ảnh minh họa, cách bạn đang xoay xở, hoặc phương án khác.
